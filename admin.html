<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --green: #1b8354;
        --ink: #1f2a37;
        --muted: #4b5563;
        --line: #d2d6db;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "IBM Plex Sans Arabic", "Cairo", Tahoma, sans-serif;
        color: var(--ink);
      }

      .page {
        min-height: 100vh;
        display: grid;
        direction: ltr;
        grid-template-columns: minmax(0, 1.18fr) minmax(340px, 0.82fr);
      }

      .art {
        background:
          url("src/assets/naama/admin-hero.jpg") center / cover no-repeat;
      }

      .panel {
        position: relative;
        direction: rtl;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 28px 18px;
        background:
          linear-gradient(180deg, #0c4a70 0%, #14607a 48%, #1a6b70 100%);
        overflow: hidden;
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: linear-gradient(180deg, transparent, #000 18%, #000 80%, transparent);
        pointer-events: none;
      }

      .drop-link {
        position: absolute;
        left: 8%;
        bottom: 14%;
        width: 46px;
        height: 60px;
        color: rgba(255, 255, 255, 0.85);
        z-index: 2;
      }

      .drop-link:hover {
        color: #fff;
      }

      .drop {
        width: 100%;
        height: 100%;
        display: block;
      }

      .logo {
        position: relative;
        height: 64px;
        width: auto;
        filter: brightness(0) invert(1);
      }

      .card {
        position: relative;
        width: min(380px, 100%);
        margin-top: 22px;
        background: #fff;
        border-radius: 2px;
        padding: 22px 22px 16px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
      }

      .card-title {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 0;
        color: var(--green);
        font-size: 26px;
        font-weight: 700;
        line-height: 1.3;
      }

      .badge {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--green);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }

      .badge svg {
        width: 13px;
        height: 13px;
      }

      .field {
        margin-top: 16px;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
        text-align: right;
      }

      .field input {
        width: 100%;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: #fff;
        padding: 0 12px;
        font: inherit;
        font-size: 15px;
        color: var(--ink);
        outline: none;
      }

      .field input:focus {
        border-color: var(--green);
      }

      .remember {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        margin-top: 12px;
        color: var(--ink);
        font-size: 14px;
        cursor: pointer;
        user-select: none;
      }

      .remember input {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: var(--green);
      }

      .btn {
        width: 100%;
        height: 42px;
        margin-top: 14px;
        border-radius: 4px;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-primary {
        border: 0;
        background: var(--green);
        color: #fff;
      }

      .btn-primary:hover {
        background: #176f47;
      }

      .btn-ghost {
        border: 1px solid #cfd4dc;
        background: #fff;
        color: var(--ink);
        font-weight: 600;
      }

      .btn-ghost:hover {
        background: #f8fafc;
      }

      .dept {
        margin: 14px 0 2px;
        color: #6b7280;
        font-size: 12px;
        text-align: center;
      }

      .legal {
        position: relative;
        z-index: 1;
        margin: 22px 0 0;
        max-width: 520px;
        color: #fff;
        font-size: 13px;
        line-height: 1.8;
        text-align: center;
      }

      @media (max-width: 900px) {
        .page {
          grid-template-columns: 1fr;
        }

        .art {
          min-height: 240px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <aside class="art" aria-hidden="true"></aside>
      <main class="panel">
        <img class="logo" src="src/assets/naama/Nama-Logo.svg" alt="منصة نما" />
        <form class="card" id="admin-login" action="#" method="post">
          <h1 class="card-title">
            <span class="badge" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-3.3 0-6 1.6-6 3.5V19h12v-1.5c0-1.9-2.7-3.5-6-3.5Z" fill="currentColor" />
              </svg>
            </span>
            تسجيل الدخول
          </h1>

          <div class="field">
            <label for="username">اسم المستخدم أو البريد الالكتروني</label>
            <input id="username" name="username" type="text" autocomplete="username" />
          </div>

          <div class="field">
            <label for="password">كلمة المرور</label>
            <input id="password" name="password" type="password" autocomplete="current-password" />
          </div>

          <label class="remember">
            <span>تذكرني</span>
            <input type="checkbox" name="remember" />
          </label>

          <button class="btn btn-primary" type="submit">تسجيل الدخول</button>
          <button class="btn btn-ghost" type="button">الدخول الموحد للموظف</button>
          <p class="dept">الإدارة العامة لتقنية المعلومات والتحول الرقمي</p>
        </form>
        <p class="legal">
          جميع الحقوق محفوظة لوزارة البيئة والمياه والزراعة، وكالة الوزارة لتقنية المعلومات والتحول الرقمي
        </p>
        <a class="drop-link" href="index.html" aria-label="الانتقال إلى دليل الخدمات">
          <svg class="drop" viewBox="0 0 64 84">
            <path d="M32 4C32 4 8 36 8 52a24 24 0 0 0 48 0C56 36 32 4 32 4Z" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M26 58c2 6 8 8 12 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </a>
      </main>
    </div>
    <script>
      document.getElementById('admin-login').addEventListener('submit', function (event) {
        event.preventDefault();
        window.location.href = 'index.html?login=u-officer#/app';
      });
    </script>
  </body>
</html>
